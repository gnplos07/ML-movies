<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MovieMatch</title>
</head>
<body>
    <main>
        <h1>MovieMatch</h1>

        <form id="movie-search">
            <label for="movie-title">Movie title</label>
            <input id="movie-title" name="title" type="text" placeholder="e.g. Avatar" required>
            <button type="submit">Find similar movies</button>
        </form>

        <p id="search-status" role="status"></p>
        <ul id="recommendations"></ul>
    </main>
</body>
</html>
